plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.businessmanager.app'
    compileSdk 33
    ndkVersion "25.2.9519653"      // ← version GitHub runners actually have

    defaultConfig {
        applicationId "com.businessmanager.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }
}

// ✅ Chaquopy 14 uses top-level blocks, NOT chaquopy { defaultConfig { } }
python {
    version = "3.8"
    pip {
        install "reportlab==3.6.12"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
