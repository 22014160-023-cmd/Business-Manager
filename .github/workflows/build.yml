name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle (cache)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'
    - name: Accept Android SDK licenses
      run: |
        set -e
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;23.1.7779620"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4096m --stacktrace
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BusinessManager-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
