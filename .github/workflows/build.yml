name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle (with caching)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'
    
    - name: Set SDK path and Accept Licenses
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4096m --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BusinessManager-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
